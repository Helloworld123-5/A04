<!-- Tells the browser that this document uses HTML5 -->
<!DOCTYPE html>

<!-- Starts the HTML document and sets the language to English -->
<html lang="en">

<!-- Starts the head section of the webpage -->
<head>

    <!-- Sets the character encoding for the webpage -->
    <meta charset="UTF-8">

    <!-- Makes the webpage display correctly on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets the title shown on the browser tab -->
    <title>My First Web Page</title>

<!-- Ends the head section -->
</head>

<!-- Starts the visible content of the webpage -->
<body>

    <!-- Displays the main heading -->
    <h1>My First Web Page</h1>

    <!-- Displays my username -->
    <p>Username: Helloworld123-5</p>

    <!-- Displays my course name -->
    <p>Course Name: Introduction to Website Development</p>

    <!-- Displays my course number -->
    <p>Course Number: IS117</p>

    <!-- Displays my course section -->
    <p>Course Section: 003</p>

    <!-- Starts the footer section -->
    <footer>

        <!-- Displays the copyright symbol, my name, and the due date -->
        <p>&copy; 2026 Liza Naas | Due Date: October 6, 2026</p>

    <!-- Ends the footer section -->
    </footer>

<!-- Ends the visible content of the webpage -->
</body>

<!-- Ends the HTML document -->
</html>
